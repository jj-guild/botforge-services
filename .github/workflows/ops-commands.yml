# Ops commands — /logs, /restart, /rollback, /dump-db as PR or issue
# comments. The debugging and incident handle for ops (and the agent
# sessions working for them): read the test logs from a thread to debug
# a failed deployment, restart a stuck stack, roll a bad pin back,
# dump a database for a prod bug ticket.
#
# Gating (fail-closed, before any dispatch): the roster authority
# matrix (CONTRIBUTORS.md, botforge repo) decides per command through
# the reusable authorize.yml gate —
#   /logs      capability env-logs    (ops anywhere; dev on test)
#   /restart   capability env-control (ops anywhere; dev on test)
#   /rollback  capability rollback     (ops only)
#   /dump-db   capability db-dump     (ops only)
#   /reset-env capability env-reset   (self env only; ops anywhere)
# Every command gets an immediate acknowledgment: what will happen and
# why the requestor may ask for it.
#
# Execution: botforge-infra owns the environments, so each command
# dispatches there (repository_dispatch / workflow_dispatch through the
# kingdoms-deployer App token — same single-writer design as /deploy).
# The infra side runs on the environment's own runner and reports back.
name: Ops commands (comments)

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ops-commands-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  authorize:
    name: Parse, acknowledge, pre-check
    if: >-
      startsWith(github.event.comment.body, '/logs') ||
      startsWith(github.event.comment.body, '/restart') ||
      startsWith(github.event.comment.body, '/start') ||
      startsWith(github.event.comment.body, '/stop') ||
      startsWith(github.event.comment.body, '/status') ||
      startsWith(github.event.comment.body, '/rollback') ||
      startsWith(github.event.comment.body, '/dump-db') ||
      startsWith(github.event.comment.body, '/reset-env') ||
      startsWith(github.event.comment.body, '/seed') ||
      startsWith(github.event.comment.body, '/clean-env') ||
      startsWith(github.event.comment.body, '/clear-db')
    runs-on: ubuntu-latest
    outputs:
      command: ${{ steps.parse.outputs.command }}
      environment: ${{ steps.parse.outputs.environment }}
      capability: ${{ steps.parse.outputs.capability }}
      comment_id: ${{ steps.ack.outputs.comment_id }}
    steps:
      - name: Parse the command (untrusted input — env var, never inline)
        id: parse
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENTER: ${{ github.event.comment.user.login }}
          GH_TOKEN: ${{ github.token }}
        run: |
          body="$COMMENT_BODY"
          command="$(echo "$body" | awk '{print $1}')"
          case "$command" in
            /logs|/restart|/start|/stop|/status|/rollback|/dump-db|/reset-env|/seed|/clean-env|/clear-db) ;;
            *) echo "::error::unsupported command: $command"; exit 1 ;;
          esac
          env_name="$(echo "$body" | awk '{print $2}')"
          # The requestor's roster alias, resolved from the roster on
          # kingdoms main via the GitHub API. It is the default target env
          # (lowercased to match the env naming) when no explicit env is
          # given, and the alias-first name used in ack comments — never a
          # @login mention, which would ping the maintainer on every
          # agent-driven command (botforge-services#358).
          alias="$(gh api /repos/jj-guild/botforge/contents/CONTRIBUTORS.md --jq .content | base64 -d | grep -F "| @${COMMENTER} |" | head -1 | awk -F"|" "{print \$3}" | tr -d " ")"
          if [[ -z "$env_name" || "$env_name" == -* ]]; then
            [[ -n "$alias" ]] || { echo "::error::requestor has no roster entry — cannot resolve the default env; pass an explicit env (e.g. /${command#/} test)" >&2; exit 1; }
            env_name="${alias,,}"
          fi
          # Each command maps to one roster capability (CONTRIBUTORS.md
          # authority matrix): the routing and the gate share this mapping.
          case "${command#/}" in
            logs)    capability=env-logs ;;
            restart|start|stop) capability=env-control ;;
            status)  capability=env-control ;;
            rollback) capability=rollback ;;
            dump-db)  capability=db-dump ;;
            reset-env) capability=env-reset ;;
            seed)      capability=env-control ;;
            clean-env) capability=env-control ;;
            clear-db) capability=env-control ;;
          esac
          {
            echo "command=${command#/}"
            echo "environment=$env_name"
            echo "capability=$capability"
            echo "alias=${alias:-$COMMENTER}"
          } >> "$GITHUB_OUTPUT"

      - name: Open the tracking comment (what, why — one table, a row per step)
        id: ack
        uses: actions/github-script@v7
        env:
          # Values derived from the untrusted comment body flow through the
          # environment, never inline in the script (script-injection
          # hardening).
          COMMAND: ${{ steps.parse.outputs.command }}
          ENVIRONMENT: ${{ steps.parse.outputs.environment }}
          CAPABILITY: ${{ steps.parse.outputs.capability }}
          ALIAS: ${{ steps.parse.outputs.alias }}
        with:
          script: |
            const cmd = process.env.COMMAND || "";
            const env = process.env.ENVIRONMENT || "";
            const capability = process.env.CAPABILITY || "";
            const requestor = process.env.ALIAS || context.payload.comment.user.login;
            const commenter = context.payload.comment.user.login;
            const esc = s => s.replace(/\|/g, "\\|");
            const ts = new Date().toISOString().slice(0, 19).replace("T", " ") + " UTC";
            const why = {
              logs: `collecting the ${env} logs and posting them back here (read-only: no deploy, no state change)`,
              restart: `restarting the ${env} stack in place (no pull, no recreate, no state change)`,
              start: `starting the ${env} stack in place (no pull, no recreate, no state change)`,
              stop: `stopping the ${env} stack in place (containers kept, no state change)`,
              status: `reporting the ${env} stack state back here (read-only: no deploy, no state change)`,
              rollback: `reverting the last pinned image on deploy/${env} (the push re-triggers the deployment of the previous known-good image)`,
              "dump-db": `dumping the ${env} databases (mongodump + Redis snapshot), archived on the hosting and uploaded as a private artifact`,
              "reset-env": `wiping the ${env} data volumes and reseeding from the workflow datasets (destructive: the env's data is lost; self env only, ops anywhere)`,
              seed: `seeding the ${env} data from the requested source file (idempotent: re-running is safe)`,
              "clean-env": `cleaning the ${env} runner's Docker residue (dangling images, stopped containers, build cache; never the running stack)`,
              "clear-db": `dropping the ${env}'s NAMED collections ONLY (the arguments; validated names): a surgical wipe, everything else lives`,
            }[cmd] || `running on ${env}`;
            const body = [
              "<!-- botforge-ops-tracking -->",
              `**/${cmd} intercepted** — ${why}. Checking the roster authority matrix for **${requestor}** (capability \`${capability}\`) — verdict right away.`,
              "",
              "**Status:** ⏳ pending gate",
              "",
              "| | |",
              "| --- | --- |",
              `| Command | \`/${cmd} ${esc(env)}\` |`,
              `| Environment | \`${esc(env)}\` |`,
              `| Requested by | ${requestor} (@${commenter}) |`,
              "| Rights | (pending gate) |",
              "| Authorized | ⏳ pending gate |",
              `| Started | ${ts} |`,
              "| Finished | — |",
              "",
              "### Steps",
              "",
              "| When (UTC) | Step | Status | Details |",
              "| --- | --- | --- | --- |",
              `| ${ts} | command received | ⏳ | \`/${cmd} ${esc(env)}\` by ${requestor} (@${commenter}) |`,
              "<!-- botforge-steps-end -->",
              "",
              "_Updated automatically as the command runs — one row per step._",
            ].join("\n");
            const { data: comment } = await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
            core.setOutput("comment_id", comment.id);


  # A reusable workflow can only be called at the job level (a job with
  # `uses:` cannot mix in `steps:`) — the roster gate is its own job
  # between the parse/ack job and the dispatch job.
  gate:
    name: Roster gate
    needs: authorize
    uses: jj-guild/botforge/.github/workflows/authorize.yml@main
    with:
      capability: ${{ needs.authorize.outputs.capability }}
      environment: ${{ needs.authorize.outputs.environment }}
      requestor: ${{ github.event.comment.user.login }}
      pr-number: ${{ github.event.issue.number }}

  deny:
    name: Record the gate denial in the tracking comment
    needs: [authorize, gate]
    if: needs.authorize.result == 'success' && needs.gate.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Update the tracking comment — denied
        uses: actions/github-script@v7
        env:
          VERDICT: ${{ needs.gate.outputs.verdict }}
          REASON: ${{ needs.gate.outputs.reason }}
          CAPABILITY: ${{ needs.authorize.outputs.capability }}
        with:
          script: |
            const ts = new Date().toISOString().slice(0, 19).replace("T", " ") + " UTC";
            const verdict = process.env.VERDICT || "DENIED";
            const reason = (process.env.REASON || "").replace(/\|/g, "\\|");
            const capability = process.env.CAPABILITY || "";
            const { data: c } = await github.rest.issues.getComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: ${{ needs.authorize.outputs.comment_id }},
            });
            const body = c.body
              .replace(/\*\*Status:\*\* [^\n]*/, "**Status:** ⛔ denied")
              .replace("| Authorized | ⏳ pending gate |", `| Authorized | ⛔ ${verdict}${reason ? " — " + reason : ""} |`)
              .replace("| Rights | (pending gate) |", `| Rights | capability \`${capability}\` — denied by the authority matrix |`)
              .replace("| Finished | — |", `| Finished | ${ts} |`)
              .replace("<!-- botforge-steps-end -->",
                `| ${ts} | gate | ⛔ | ${verdict}${reason ? " — " + reason : ""} — no dispatch ran |\n<!-- botforge-steps-end -->`);
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: c.id,
              body,
            });

  execute:
    name: Dispatch to botforge-infra
    needs: [authorize, gate]
    runs-on: ubuntu-latest
    outputs:
      workflow: ${{ steps.route.outputs.workflow }}
    steps:
      - name: Mint the kingdoms-deployer App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.BOTFORGE_DEPLOYER_APP_ID }}
          private-key: ${{ secrets.BOTFORGE_DEPLOYER_APP_PRIVATE_KEY }}
          owner: jj-guild
          repositories: botforge-infra

      - name: Route the command
        id: dispatch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMAND: ${{ needs.authorize.outputs.command }}
          ENVIRONMENT: ${{ needs.authorize.outputs.environment }}
          REQUESTOR: ${{ github.event.comment.user.login }}
          THREAD: ${{ github.event.issue.number }}
        run: |
          case "$COMMAND" in
            logs)
              # /logs [env] [--service S] [--since 30m] [--from iso] [--to iso] [--tail N]
              # The env-logs job declares the GitHub environment <env> (its
              # secrets carry DISCORD_TOKEN), so the deployment branch policy
              # applies: dispatch on the state branch deploy/<env>, like every
              # other environment job, and forward the filter tokens as inputs.
              SERVICE="$(echo "$COMMENT_BODY" | grep -oP '(?<=--service )\S+' || true)"
              SINCE="$(echo "$COMMENT_BODY" | grep -oP '(?<=--since )\S+' || true)"
              FROM="$(echo "$COMMENT_BODY" | grep -oP '(?<=--from )\S+' || true)"
              TO="$(echo "$COMMENT_BODY" | grep -oP '(?<=--to )\S+' || true)"
              TAIL="$(echo "$COMMENT_BODY" | grep -oP '(?<=--tail )\S+' || true)"
              ARGS=(--repo jj-guild/botforge-infra --ref "deploy/$ENVIRONMENT" -f environment="$ENVIRONMENT")
              [[ -n "$SERVICE" ]] && ARGS+=(-f service="$SERVICE")
              [[ -n "$SINCE" ]]   && ARGS+=(-f since="$SINCE")
              [[ -n "$FROM" ]]    && ARGS+=(-f from="$FROM")
              [[ -n "$TO" ]]      && ARGS+=(-f to="$TO")
              [[ -n "$TAIL" ]]    && ARGS+=(-f tail="$TAIL")
              gh workflow run env-logs.yml "${ARGS[@]}"
              ;;
            restart|start|stop|status|clear-db)
              # env-control is workflow_dispatch-only (two choice lists);
              # reuse it through gh workflow run with its own inputs.
              # Dispatch on the state branch deploy/<env>: the job targets
              # the GitHub environment <env>, whose deployment branch policy
              # only allows deploy/<env> — a dispatch from main is rejected
              # by the environment protection.
              COLLECTIONS=""
              if [[ "$COMMAND" == "clear-db" ]]; then
                # /clear-db [env] col1 [col2...]: when arg 2 names a known
                # env it IS the env; otherwise every arg after the command
                # is a collection on the requestor's default env.
                ARG2="$(echo "$COMMENT_BODY" | awk '{print $2}')"
                if [[ -n "$ARG2" && ! "$ARG2" =~ ^- ]]; then
                  case "$ARG2" in
                    merlin|test|prod|drasah) shift_words=2 ;;
                    *) shift_words=1 ;;
                  esac
                else
                  shift_words=1
                fi
                COLLECTIONS="$(echo "$COMMENT_BODY" | awk -v skip=$shift_words '{for(i=skip+1;i<=NF;i++) printf "%s ", $i}' | sed 's/ *$//' | cut -c1-200)"
                [[ -n "$COLLECTIONS" ]] || { echo "::error::/clear-db needs at least one collection name"; exit 1; }
              fi
              ARGS=(-f command="$COMMAND" -f environment="$ENVIRONMENT")
              [[ -n "$COLLECTIONS" ]] && ARGS+=(-f collections="$COLLECTIONS")
              gh workflow run env-control.yml \
                --repo jj-guild/botforge-infra \
                --ref "deploy/$ENVIRONMENT" \
                "${ARGS[@]}"
              ;;
            reset-env)
              # Destructive: gated by the env-reset capability (self env
              # only, ops anywhere) in the roster matrix; env-control's
              # reset command does the wipe + reseed on the env's runner.
              # Fail-closed before any dispatch: prod is never resettable,
              # no matter the roster verdict (the infra side re-checks).
              if [[ "$ENVIRONMENT" == "prod" ]]; then
                echo "::error::/reset-env is never allowed on prod — refusing before any dispatch (env-reset denies it for every role, and prod carries no resettable flag)" >&2
                exit 1
              fi
              gh workflow run env-control.yml \
                --repo jj-guild/botforge-infra \
                --ref "deploy/$ENVIRONMENT" \
                -f command=reset \
                -f environment="$ENVIRONMENT"
              ;;
            seed)
              # /seed <env> <type> [file] [ladder_id|guild_id] — idempotent data
              # seeding through the env's botforge-core container
              # (botforge-infra env-seed.yml). Same env-control capability
              # as restart: seeding is additive, never destructive.
              # ladder-season takes the target test guild id (guild-scoped,
              # fail-closed in env-seed.yml against the env's TEST_GUILD_ID —
              # it creates the guild's ladder and its indexed season); the
              # other types take the ladder id / owner_ref.
              SEED_TYPE="$(echo "$COMMENT_BODY" | awk '{print $3}')"
              SEED_FILE="$(echo "$COMMENT_BODY" | awk '{print $4}')"
              [[ -n "$SEED_TYPE" ]] || { echo "::error::usage: /seed <env> <users|ladder-season|season|test-season> [file] [ladder_id|guild_id]" >&2; exit 1; }
              ARGS=(--repo jj-guild/botforge-infra --ref "deploy/$ENVIRONMENT" -f environment="$ENVIRONMENT" -f type="$SEED_TYPE")
              [[ -n "$SEED_FILE" ]] && ARGS+=(-f file="$SEED_FILE")
              LAST_ARG="$(echo "$COMMENT_BODY" | awk '{print $5}')"
              if [[ -n "$LAST_ARG" ]]; then
                if [[ "$SEED_TYPE" == "ladder-season" ]]; then
                  ARGS+=(-f "guild_id=$LAST_ARG")
                else
                  ARGS+=(-f "ladder_id=$LAST_ARG")
                fi
              fi
              gh workflow run env-seed.yml "${ARGS[@]}"
              ;;
            rollback)
              gh api --method POST repos/jj-guild/botforge-infra/dispatches \
                -f event_type=rollback-state \
                -f 'client_payload[env]='"$ENVIRONMENT" \
                -f 'client_payload[reason]="/'"$COMMAND"' requested by '"$REQUESTOR"' on #'"$THREAD" \
                -f 'client_payload[requestor]='"$REQUESTOR"
              ;;
            dump-db)
              gh workflow run db-daily-dump.yml \
                --repo jj-guild/botforge-infra \
                -f environment="$ENVIRONMENT"
              ;;
            clean-env)
              # /clean-env [env] [--deep] — clean the env runner's Docker
              # residue (docker-clean.yml on the infra side, which
              # re-checks the roster and refuses prod). prune by default;
              # --deep also drops the unused volumes/images (anything the
              # running or stopped-but-referenced containers use stays).
              if [[ "$ENVIRONMENT" == "prod" ]]; then
                echo "::error::/clean-env is never allowed on prod — refusing before any dispatch" >&2
                exit 1
              fi
              MODE="prune"
              echo "$COMMENT_BODY" | grep -q -- "--deep" && MODE="deep"
              gh workflow run docker-clean.yml \
                --repo jj-guild/botforge-infra \
                --ref "deploy/$ENVIRONMENT" \
                -f environment="$ENVIRONMENT" \
                -f mode="$MODE" \
                -f requestor="$REQUESTOR"
              ;;
          esac
      - name: Record the dispatched workflow for the reporter
        id: route
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          COMMAND: ${{ needs.authorize.outputs.command }}
        run: |
          case "$COMMAND" in
            logs)          WF="env-logs.yml" ;;
            restart|start|stop|status) WF="env-control.yml" ;;
            dump-db)       WF="db-daily-dump.yml" ;;
            clean-env)     WF="docker-clean.yml" ;;
            *)             WF="" ;;
          esac
          echo "workflow=${WF}" >> "$GITHUB_OUTPUT"

      - name: Update the tracking comment — authorized and dispatched
        uses: actions/github-script@v7
        env:
          COMMAND: ${{ needs.authorize.outputs.command }}
          ENVIRONMENT: ${{ needs.authorize.outputs.environment }}
          CAPABILITY: ${{ needs.authorize.outputs.capability }}
          WORKFLOW: ${{ steps.route.outputs.workflow }}
          VERDICT: ${{ needs.gate.outputs.verdict }}
          REASON: ${{ needs.gate.outputs.reason }}
        with:
          script: |
            const ts = new Date().toISOString().slice(0, 19).replace("T", " ") + " UTC";
            const cmd = process.env.COMMAND || "";
            const env = process.env.ENVIRONMENT || "";
            const capability = process.env.CAPABILITY || "";
            const wf = process.env.WORKFLOW || "";
            const verdict = process.env.VERDICT || "ALLOWED";
            const reason = (process.env.REASON || "").replace(/\|/g, "\\|");
            const roles = ((reason.match(/\(([^)]+)\)/) || [])[1] || "").replace(/\|/g, "\\|");
            const icon = verdict === "ALLOWED" ? "✅" : "⛔";
            const { data: c } = await github.rest.issues.getComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: ${{ needs.authorize.outputs.comment_id }},
            });
            const gateRow = `| ${ts} | gate | ${icon} | ${verdict}${reason ? " — " + reason : ""} |`;
            const dispatchRow = `| ${ts} | dispatched | ⏳ | /${cmd} on ${env} — ${wf ? `dispatched ${wf} on deploy/${env}` : `dispatched on deploy/${env}`} |`;
            const body = c.body
              .replace(/\*\*Status:\*\* [^\n]*/, "**Status:** ⏳ running")
              .replace("| Rights | (pending gate) |", `| Rights | ${roles || "see verdict"} (capability \`${capability}\`) |`)
              .replace("| Authorized | ⏳ pending gate |", `| Authorized | ${icon} ${verdict}${reason ? " — " + reason : ""} |`)
              .replace("<!-- botforge-steps-end -->",
                `${gateRow}\n${dispatchRow}\n<!-- botforge-steps-end -->`);
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: c.id,
              body,
            });

  report:
    name: Report the result back on the PR
    needs: [authorize, gate, execute]
    if: needs.execute.outputs.workflow != ''
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    outputs:
      run_url: ${{ steps.wait.outputs.run_url }}
      conclusion: ${{ steps.wait.outputs.conclusion }}
    steps:
      - name: Mint the kingdoms-deployer App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.BOTFORGE_DEPLOYER_APP_ID }}
          private-key: ${{ secrets.BOTFORGE_DEPLOYER_APP_PRIVATE_KEY }}
          owner: jj-guild
          repositories: botforge-infra
      - name: Wait for the environment workflow to finish
        id: wait
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          WF: ${{ needs.execute.outputs.workflow }}
          ENVIRONMENT: ${{ needs.authorize.outputs.environment }}
          SINCE: ${{ github.event.comment.created_at }}
        run: |
          since="${SINCE}"
          deadline=$(( SECONDS + 600 ))
          run_id=""
          while (( SECONDS < deadline )); do
            run_id="$(gh run list --repo jj-guild/botforge-infra \
              --workflow "$WF" --branch "deploy/$ENVIRONMENT" --limit 5 \
              --json databaseId,status,conclusion,createdAt \
              --jq "[.[] | select(.createdAt >= \"$since\")] | .[0] // empty" || true)"
            [[ -n "$run_id" ]] && break
            sleep 10
          done
          [[ -n "$run_id" ]] || { echo "conclusion=not_found" >> "$GITHUB_OUTPUT"; exit 0; }
          rid="$(echo "$run_id" | python3 -c 'import json,sys; print(json.load(sys.stdin)["databaseId"])')"
          gh run watch "$rid" --repo jj-guild/botforge-infra --exit-status > /dev/null 2>&1 || true
          conclusion="$(gh run view "$rid" --repo jj-guild/botforge-infra --json conclusion --jq .conclusion)"
          {
            echo "run_url=https://github.com/jj-guild/botforge-infra/actions/runs/$rid"
            echo "run_id=$rid"
            echo "conclusion=$conclusion"
          } >> "$GITHUB_OUTPUT"
      - name: Collect the result payload (logs excerpt or control dump)
        id: payload
        if: steps.wait.outputs.conclusion != '' && steps.wait.outputs.conclusion != 'not_found'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          COMMAND: ${{ needs.authorize.outputs.command }}
          RUN_ID: ${{ steps.wait.outputs.run_id }}
          ENVIRONMENT: ${{ needs.authorize.outputs.environment }}
        run: |
          if [[ "$COMMAND" == "logs" ]]; then
            artifact_name="$(gh api "repos/jj-guild/botforge-infra/actions/runs/$RUN_ID/artifacts" --jq '.artifacts[0].name' 2>/dev/null || true)"
            if [[ -n "$artifact_name" ]]; then
              mkdir -p /tmp/envlogs && cd /tmp/envlogs
              artifact_id="$(gh api "repos/jj-guild/botforge-infra/actions/runs/$RUN_ID/artifacts" --jq '.artifacts[0].id')"
              gh api "repos/jj-guild/botforge-infra/actions/artifacts/$artifact_id/zip" > artifact.zip
              unzip -o artifact.zip logs.txt >/dev/null
              {
                echo '```'
                tail -n 40 logs.txt
                echo '```'
              } > excerpt.txt
              {
                echo "excerpt<<EOF"
                cat excerpt.txt
                echo "EOF"
              } >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Update the tracking comment — result
        uses: actions/github-script@v7
        env:
          COMMAND: ${{ needs.authorize.outputs.command }}
          ENVIRONMENT: ${{ needs.authorize.outputs.environment }}
          ALIAS: ${{ needs.gate.outputs.alias }}
          RUN_URL: ${{ steps.wait.outputs.run_url }}
          CONCLUSION: ${{ steps.wait.outputs.conclusion }}
          EXCERPT: ${{ steps.payload.outputs.excerpt }}
        with:
          script: |
            const ts = new Date().toISOString().slice(0, 19).replace("T", " ") + " UTC";
            const cmd = process.env.COMMAND || "";
            const env = process.env.ENVIRONMENT || "";
            const runUrl = process.env.RUN_URL || "";
            const conclusion = process.env.CONCLUSION || "";
            const excerpt = process.env.EXCERPT || "";
            const icon = conclusion === "success" ? "✅" : "❌";
            const { data: c } = await github.rest.issues.getComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: ${{ needs.authorize.outputs.comment_id }},
            });
            let body;
            if (conclusion === "not_found") {
              body = c.body
                .replace(/\*\*Status:\*\* [^\n]*/, "**Status:** ⚠️ run not found")
                .replace("| Finished | — |", `| Finished | ${ts} |`)
                .replace("<!-- botforge-steps-end -->",
                  `| ${ts} | result | ⚠️ | /${cmd} on ${env} — dispatched but the run could not be located; check botforge-infra actions |\n<!-- botforge-steps-end -->`);
            } else {
              body = c.body
                .replace(/\*\*Status:\*\* [^\n]*/, `**Status:** ${icon} ${conclusion}`)
                .replace("| Finished | — |", `| Finished | ${ts} |`)
                .replace("<!-- botforge-steps-end -->",
                  `| ${ts} | result | ${icon} | **/${cmd} on ${env}** — ${conclusion} — [run](${runUrl}) |\n<!-- botforge-steps-end -->`);
              if (cmd === "logs" && excerpt) {
                body += `\n\nLast lines (full dump in the run's private artifact):\n${excerpt}`;
              }
            }
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: c.id,
              body,
            });
