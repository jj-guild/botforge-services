# Arena — the permanent example mod (kingdoms-services#267 chantier 4).
#
# Always on: the enrollment is GLOBAL (no season), the map pool rides
# the mod's settings. The whole parcours — player panel (/arena),
# validation in the admin channel, suspend/resume, the section's
# Synchroniser — comes from the platform's generic surfaces: this
# declaration plus a one-line register hook IS the mod.
id: arena
enabled: true
seasonal: false
required_games: [aoe2]
channel_groups:
  - key: jeux
    display_name: 🏟 Arène
  - key: admin
    display_name: ⚙️ Arène — admin
    admin_only: true
channels:
  - key: annonces
    display_name: 📢 annonces
    description: The arena's announcements (admin-written, everyone-readable)
    group: jeux
    kind: announce
  - key: admin
    display_name: 🛠 validation
    description: The candidates' validation messages (mod admins only)
    group: admin
roles:
  - key: player
    display_name: Arena Player
    color: 0x3498DB
  - key: admin
    display_name: Arena Admin
    color: 0xE74C3C
    hoisted: true
    admin: true
settings:
  enrollment:
    # the validation goes through a message in the admin channel —
    # an admin accepts or refuses from the message's buttons
    manual: true
    # a bound aoe2 account is required to apply
    requires_profile: true
workflows: []
commands: [arena]
dependencies: []
