# kingdom mod declaration (botforge mod init).
# Schema (validated by botforge.core.services.mod_registry at startup):
#   id            required, simple slug, must match the package name
#   enabled       bool (default true); disabled mods are never loaded
#   seasonal      bool, MANDATORY; the mod type (seasonal or permanent)
#                 branches the admin surface (lifecycle panel + season
#                 salons vs one guild-level config channel)
#   settings      free-form, mod-specific
#   channels      list of {key, display_name, description, per_instance}
#   roles         list of {key, display_name, color, hoisted}
#   workflows     list of workflow names implemented by the mod
#   commands      list of command names implemented by the mod
#   dependencies  list of mod ids this mod depends on
#   required_games  list of game ids this mod requires (installed along with
#                 the mod; uninstalling such a game is refused while the
#                 mod is active)
#   private       bool (default false); a private mod is provisioned and
#                 visible only to its owners and the bot admins
#   owner_discord_ids  list of Discord user ids (mandatory when private)
# Channels are addressed at runtime as "mod:key" (e.g. "kingdom:announce").
id: kingdom
enabled: true
seasonal: true
emoji: "👑"
private: true
owner_discord_ids:
  - "242421489536729100"
settings: {}
# The mod's channels are ITS declaration (source of truth — the real
# structure lands with the portage, botforge-services#216 / D70); the
# interim folder demonstrates the convention: general, the mod's own,
# admin
channels:
  - key: general
    display_name: "🛡️ général"
    description: The kingdom mod's front door
  - key: announce
    display_name: "📣 annonces"
    description: Where the kingdom mod posts announcements
  - key: admin
    display_name: "🛠️ admin"
    description: The kingdom mod's operators
roles:
  - key: kingdom_member
    display_name: Kingdom Member
workflows: []
commands:
  - kingdom
dependencies: []
required_games:
  - aoe2
