# Kingdom mod (Season II territory-conquest AoE2).
#
# REFERENCE EXAMPLE (docs/GUIDES/mod-init.md, botforge repo): this is the
# REAL, CURRENT declaration from the vibe/drasah/main integration branch
# (PR botforge-services#244) — salons-first structure (botforge-services#138,
# botforge-services#175): channel groups, kinds, admin-only flags and
# access policies are data here, never code in the mod.
#
# One self-contained directory per mod (botforge-services#178): the code's
# mechanical move into this directory is accompanied with Drasah.
#
# false until the code moves from vibe/drasah/main into this directory
# (botforge-services#178 mechanical move) — flip to true in that same PR.
id: kingdom
enabled: false
seasonal: true
# the visual identity is data (#334): the entry buttons carry it
emoji: "👑"
settings: {}
channel_groups:
  - key: profiles
    display_name: 👤 ᴘʀᴏꜰɪʟs
  # restructuration-serveur-v1 e (Drasah 19/10): the general group is
  # GONE ENTIRELY (Taverne + the vocal) — nothing is kept or moved.
  - key: conscription
    display_name: ✒️ ᴄᴏɴsᴄʀɪᴘᴛɪᴏɴ
  - key: kingdom
    display_name: 🏰 ᴋɪɴɢᴅᴏᴍs
  - key: gaia
    display_name: 🏰 ɢᴀɪᴀ
  - key: battlefield
    display_name: ⚔️ ᴄʜᴀᴍᴘs ᴅᴇ ʙᴀᴛᴀɪʟʟᴇ
  - key: admin
    display_name: ⚙️ ᴀᴅᴍɪɴ
    admin_only: true
channels:
  # restructuration-serveur-v1 e (Drasah 19/10): the general group and
  # its Taverne are RETIRED — the category disappears at the next
  # provisioning (the legacy cleanup sweeps both).
  - key: apply
    display_name: 📝 postuler
    description: The enrollment panel channel
    group: conscription
  - key: applications
    display_name: 📥 candidatures
    description: Submitted applications (admin only)
    group: conscription
    admin_only: true
    access:
      everyone_view: false
      view: [Kingdom Admin]
  - key: realms
    display_name: 👑 royaumes
    description: Kingdom validation panel (admin only)
    group: conscription
    admin_only: true
    access:
      everyone_view: false
      view: [Kingdom Admin]
  - key: scriptorium
    display_name: 📜 scriptorium
    description: Sommaire — Cadastre, Diplomatie, Seigneurie (ephemeral rubrics)
    group: kingdom
    # permissions-serveur-v1 (Drasah 19/10): a newcomer sees only
    # Conscription and Beta — every other salon denies @everyone and
    # unlocks through the player roles (granted at acceptance).
    access:
      everyone_view: false
      view: [Kingdom Lord, Kingdom King, Kingdom Admin]
  - key: market
    display_name: 🛒 marché
    description: Kingdom market (trades and resources)
    group: kingdom
    access:
      everyone_view: false
      view: [Kingdom Lord, Kingdom King, Kingdom Admin]
  - key: geopolitics
    display_name: 🌍 géopolitique
    description: Announcements, treaties and political rules
    group: kingdom
    # permissions-serveur-v1: the pinned age message lives here (the
    # dedicated 🏺 Âge salon is gone — its name now carries the age emoji).
    access:
      everyone_view: false
      view: [Kingdom Lord, Kingdom King, Kingdom Admin]
  - key: territory
    display_name: 🗺️ territoire
    description: Territories and their cadastre effects — plus the Gaïa AI level (restructuration-serveur-v1 c, Drasah 19/10)
    group: gaia
    # restructuration-serveur-v1 c (Drasah 19/10): patrol (AI level)
    # merged into this Territoire view; exploration is an EPHEMERAL FFA
    # salon opened when a free-for-all manifests — both salons retire.
    access:
      everyone_view: false
      view: [Kingdom Lord, Kingdom King, Kingdom Admin]
  - key: attack
    display_name: ⚔️ déclarer une attaque
    description: The guided attack declaration panel
    group: battlefield
    access:
      everyone_view: false
      view: [Kingdom Lord, Kingdom King, Kingdom Admin]
  - key: talks
    display_name: 🕊️ pourparlers
    description: War negotiations
    group: battlefield
    access:
      everyone_view: false
      view: [Kingdom Lord, Kingdom King, Kingdom Admin]
      post: [Kingdom Lord, Kingdom King, Kingdom Admin]
  - key: settings
    display_name: ⚙️ paramètres
    description: Mod settings panel channel
    group: admin
    # permissions-serveur-v1: the admin category and its salons are
    # admin-only — an explicit access block keeps the provisioning's
    # policy application from re-granting @everyone view (the default
    # policy is everyone_view: true).
    access:
      everyone_view: false
      view: [Kingdom Admin]
  - key: season_management
    display_name: 🗓️ gestion saison
    description: Season management (admin only)
    group: admin
    access:
      everyone_view: false
      view: [Kingdom Admin]
  - key: time_machine
    display_name: ⏱️ machine à temps
    description: Game-clock test panel — fast-forward and snapshots (admin only)
    group: admin
    admin_only: true
    access:
      everyone_view: false
      view: [Kingdom Admin]
  - key: distributor
    display_name: 🎁 distributeur
    description: Admin test injector — hand elements to a kingdom (admin only)
    group: admin
    admin_only: true
    access:
      everyone_view: false
      view: [Kingdom Admin]
  - key: console
    display_name: 🛠 console-admin
    description: The admin test console — text commands, answers in the salon (admin only)
    group: admin
    admin_only: true
    access:
      everyone_view: false
      view: [Kingdom Admin]
  - key: requests
    display_name: 📬 demandes
    description: Edit/leave requests (admin only)
    group: admin
    access:
      everyone_view: false
      view: [Kingdom Admin]
  # ordre-salons-v1 (Drasah 19/10): the Support group (question /
  # signaler-un-bug forums) is RETIRED — it read as a duplicate of the
  # admin salons; the anonymous Pigeon already handles a missing
  # question salon gracefully. Both slugs join LEGACY_SALON_SLUGS.
roles:
  - key: kingdom_king
    display_name: Kingdom King
    color: 0xE6B800
    hoisted: true
  - key: kingdom_lord
    display_name: Kingdom Lord
    color: 0x3498DB
  - key: kingdom_locked
    display_name: 💍 Verrouillé
    color: 0xE74C3C
  - key: kingdom_admin
    display_name: Kingdom Admin
    color: 0xE74C3C
    hoisted: true
    admin: true
workflows: []
commands: []
dependencies: []
# kingdom is an AoE2 territory-conquest mod: installing it installs aoe2
# along, and uninstalling aoe2 is refused while kingdom is active
required_games:
  - aoe2
