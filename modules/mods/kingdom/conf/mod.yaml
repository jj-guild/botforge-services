# Kingdom mod (Season II territory-conquest AoE2).
# Design: kingdoms repo docs/MODS/kingdoms/ (reference Season II + DECISIONS.md D1-D54).
# Enabled with T2 (enrollment); the declaration is validated at startup.
#
# Single source of truth of the salons-first structure (botforge#138,
# botforge-services#175): the startup provisioning and the /kingdom
# bootstrap both provision from this declaration — channel groups
# (categories), kinds (text/forum/announce) and admin-only flags are
# data here, never code in the mod.
id: kingdom
enabled: true
# the visual identity is data (#334)
emoji: "👑"
seasonal: true
# machine-room rule (Drasah 18/11): the mod's HOME folder (the
# auto-provisioned « Kingdom » category) is staff-only — the players'
# surfaces are the declared channel groups (the Conscription door),
# never the home plumbing. The gate grants the mod's admin role.
home_admin_only: true
home_view_roles: ["Kingdom Admin"]
# category-bottom (Drasah 20/11): the 👑 Kingdom machine room sinks to
# the sidebar's very end (private to staff, invisible to the players)
home_bottom: true
settings: {}
channel_groups:
  - key: profiles
    display_name: 👤 ᴘʀᴏꜰɪʟs
  # restructuration-serveur-v1 e (Drasah 19/10): the general group is
  # GONE ENTIRELY (Taverne + the vocal) — nothing is kept or moved.
  - key: conscription
    display_name: ✒️ ᴄᴏɴsᴄʀɪᴘᴛɪᴏɴ
  # restructuration-gaia-v1 (Drasah 24/10): the Gaïa group RETIRES —
  # its Territoire salon moves into the Kingdom category, which is
  # renamed « Kingdom-Gaia »; the Taverne (taverne-v1) is born here.
  - key: kingdom
    display_name: 🏰 ᴋɪɴɢᴅᴏᴍ-ɢᴀɪᴀ
  - key: battlefield
    display_name: ⚔️ ᴄʜᴀᴍᴘs ᴅᴇ ʙᴀᴛᴀɪʟʟᴇ
  # laboratoire-v3 (Drasah 19/11): the Labo group RETIRES — the visual
  # validation lives with Mistral now; the lab salons (lab, lab_original,
  # lab_travaux) are swept at the next provisioning as undeclared slugs.
  - key: admin
    display_name: ⚙️ ᴀᴅᴍɪɴ
    admin_only: true
    # category-bottom (Drasah 20/11): the ADMIN machine room sinks to
    # the sidebar's very end with the home folder (private plumbing)
    bottom: true
channels:
  # conscription-4-salons (Drasah 20/11): la CONSCRIPTION EST le
  # parcours — l'ordre de la sidebar = les étapes du joueur, et ce que
  # le joueur VOIT dit où il en est :
  # 1. « register » : public pour les SANS-compte, MASQUÉ dès le compte
  #    créé (deny_view sur le rôle d'accès « Kingdom Enregistré » — le
  #    salon disparaît de sa vue, l'étape est passée) ;
  # 2. « apply » : OUVERT par le compte — la récompense visible de
  #    l'étape 1 ; le pin porte la saison qui vit + la porte ⚔️ ;
  # 3. « seigneurerie » : caché admin — les PERSONNES (file, affectations) ;
  # 4. « realms » : caché admin — les ENTITÉS (validation des royaumes).
  - key: register
    display_name: 🪙 enregistrement
    description: The account door — create the project account and link AoE2
    group: conscription
    position: 1
    access:
      everyone_view: true
      everyone_post: false
      deny_view: [Kingdom Enregistré]
  - key: apply
    display_name: ⚔️ postuler
    description: Roi ou Seigneur ? — fonder ou rejoindre un royaume
    group: conscription
    position: 2
    access:
      everyone_view: false
      view: [Kingdom Enregistré, Kingdom Admin]
  - key: seigneurerie
    display_name: 🛡️ seigneurerie
    description: The lords' desk — queue, candidates, assignments (admin only)
    group: conscription
    position: 3
    admin_only: true
    access:
      everyone_view: false
      view: [Kingdom Admin]
  - key: realms
    display_name: 👑 royaumes
    description: Kingdom validation panel (admin only)
    group: conscription
    position: 4
    admin_only: true
    access:
      everyone_view: false
      view: [Kingdom Admin]
  # restructuration-serveur-v1 e (Drasah 19/10): the general group and
  # its Taverne are RETIRED — the category disappears at the next
  # provisioning (the legacy cleanup sweeps both).
  - key: scriptorium
    display_name: 📜 scriptorium
    description: Sommaire — Cadastre, Diplomatie, Seigneurie (ephemeral rubrics)
    group: kingdom
    # permissions-serveur-v1 (Drasah 19/10): a newcomer sees only
    # Conscription and Beta — every other salon denies @everyone and
    # unlocks through the player roles (granted at acceptance).
    access:
      everyone_view: false
      view: [Kingdom Lord, Kingdom King, Kingdom Admin]
  - key: market
    # marche-emoji-v1 (Drasah 26/10): le nom reste « marché » — seul
    # l'emoji caddie 🛒 gênait ; 💰 le remplace. La bourse est le nom
    # de la monnaie, pas du salon. Même clé (renommage id-mappé au
    # prochain provisioning).
    display_name: 💰 marché
    description: The kingdom's market — techs and actions bought with écus
    group: kingdom
    access:
      everyone_view: false
      view: [Kingdom Lord, Kingdom King, Kingdom Admin]
  - key: geopolitics
    display_name: 🌍 géopolitique
    description: Announcements, treaties and political rules
    group: kingdom
    # permissions-serveur-v1: the pinned age message lives here (the
    # dedicated 🏺 Âge salon is gone — its name now carries the age emoji).
    access:
      everyone_view: false
      view: [Kingdom Lord, Kingdom King, Kingdom Admin]
  - key: territory
    display_name: 🗺️ territoire
    description: Territories and their cadastre effects — plus the Gaïa AI level (restructuration-serveur-v1 c, Drasah 19/10)
    # restructuration-gaia-v1 (Drasah 24/10): moved from the retired
    # gaia group into kingdoms (Kingdom-Gaia).
    group: kingdom
    access:
      everyone_view: false
      view: [Kingdom Lord, Kingdom King, Kingdom Admin]
  - key: tavern
    display_name: 🍺 taverne
    description: The lords' tavern — drinks, rumors, bets and the Mercenary Chief (taverne-v1)
    group: kingdom
    access:
      everyone_view: false
      view: [Kingdom Lord, Kingdom King, Kingdom Admin]
  - key: attack
    display_name: ⚔️ déclarer une attaque
    description: The guided attack declaration panel
    group: battlefield
    access:
      everyone_view: false
      view: [Kingdom Lord, Kingdom King, Kingdom Admin]
  - key: talks
    display_name: 🕊️ pourparlers
    description: War negotiations
    group: battlefield
    access:
      everyone_view: false
      view: [Kingdom Lord, Kingdom King, Kingdom Admin]
      post: [Kingdom Lord, Kingdom King, Kingdom Admin]
  - key: time_machine
    display_name: ⏱️ machine à temps
    description: Game-clock test panel — fast-forward and snapshots (admin only)
    group: admin
    admin_only: true
    access:
      everyone_view: false
      view: [Kingdom Admin]
  - key: distributor
    display_name: 🎁 distributeur
    description: Admin test injector — hand elements to a kingdom (admin only)
    group: admin
    admin_only: true
    access:
      everyone_view: false
      view: [Kingdom Admin]
  # parametres-restore-v1 (Drasah 20/11): the console salon WEARS the
  # designer's original name — Admin > ⚙️ paramètres (capture 08/11).
  # The KEY stays `console` (the seam is stable: the settings-pin
  # fallback already heals by flattened name — console, parametres,
  # settings) and the legacy `settings` slug stays swept as
  # undeclared at the next provisioning.
  - key: console
    display_name: ⚙️ paramètres
    description: Kingdom settings — the admin season cockpit (pinned, admin only)
    group: admin
    admin_only: true
    access:
      everyone_view: false
      view: [Kingdom Admin]
  # console-removal-v1 (Drasah 25/10): the console channel block is
  # GONE — the listener never booted in prod; the live flows live on
  # the ⚙️ Paramètres panel and the salon is swept as a legacy slug.
  - key: requests
    display_name: 📬 demandes
    description: Edit/leave requests (admin only)
    group: admin
    access:
      everyone_view: false
      view: [Kingdom Admin]
  # admin-logs-v1 (Drasah 30/10): the destructive admin actions land in
  # 📜 journal-admin — a timestamped trail (ejection, reking, validation).
  - key: admin_log
    display_name: 📜 journal-admin
    description: Timestamped admin actions log (admin only)
    group: admin
    admin_only: true
    access:
      everyone_view: false
      view: [Kingdom Admin]
  # ordre-salons-v1 (Drasah 19/10): the Support group (question /
  # signaler-un-bug forums) is RETIRED — it read as a duplicate of the
  # admin salons; the anonymous Pigeon already handles a missing
  # question salon gracefully. Both slugs join LEGACY_SALON_SLUGS.
roles:
  - key: kingdom_king
    display_name: Kingdom King
    color: 0xE6B800
    hoisted: true
  - key: kingdom_lord
    display_name: Kingdom Lord
    color: 0x3498DB
  - key: kingdom_locked
    display_name: 💍 Verrouillé
    color: 0xE74C3C
  - key: kingdom_admin
    display_name: Kingdom Admin
    color: 0xE74C3C
    hoisted: true
  # salon-parcours-v2 (Drasah 18/11): the Postuler salon's access
  # role — the platform's profile.bound event grants it (the gate
  # rides the registration seam, registration_gate.py), the last
  # unbind revokes it
  - key: enregistre
    display_name: "🪙 Kingdom Enregistré"
    color: 0x5865F2
  # the season enrollment's roles (the owner's spec): the candidate
  # role lands at apply, the member role at accept; the membership
  # resets each season (the roles stay)
  - key: candidate
    display_name: "🧡 Kingdom Candidat"
    color: 0xE67E22
  - key: member
    display_name: "👥 Kingdom Joueur"
    color: 0x2ECC71
workflows: []
# kingdom is an AoE2 territory-conquest mod: installing it installs aoe2
# along, and uninstalling aoe2 is refused while kingdom is active
required_games:
  - aoe2
commands: []
dependencies: []
